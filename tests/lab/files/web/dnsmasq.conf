# The lab's "ISP resolver": answers the test zone shadow.lab and forwards every other name to the
# real Internet, so the router's WAN DNS and the VPN server (which dials sniffed names) both resolve
# lab names like public ones.
no-resolv
server=1.1.1.1
server=8.8.8.8
no-hosts
log-queries=extra
local-ttl=120
log-facility=/tmp/dnsmasq-web.log
address=/direct.shadow.lab/203.0.113.10
address=/web.shadow.lab/203.0.113.10
address=/tunnel.shadow.lab/203.0.113.11
address=/ssh.shadow.lab/203.0.113.12
address=/vpn.shadow.lab/203.0.113.20
