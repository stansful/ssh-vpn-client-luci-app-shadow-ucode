<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="900" height="236" role="img" aria-label="Как идёт трафик с Shadow">
  <title>Как идёт трафик с Shadow</title>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hi { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .srv { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.5; }
    .t { fill: #1f2328; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .s { fill: #59636e; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .lt { fill: #0969da; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .ld { fill: #59636e; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .n { fill: #59636e; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .tun { stroke: #0969da; stroke-width: 3; fill: none; }
    .dir { stroke: #8c959f; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .lan { stroke: #8c959f; stroke-width: 2; fill: none; }
    .ha { fill: #0969da; }
    .hd { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #3d444d; }
      .box, .srv { fill: #151b23; stroke: #3d444d; }
      .srv { stroke: #4493f8; }
      .hi { fill: #0c2d6b; stroke: #4493f8; }
      .t { fill: #f0f6fc; }
      .s, .ld, .n { fill: #9198a1; }
      .lt { fill: #4493f8; }
      .tun { stroke: #4493f8; }
      .ha { fill: #4493f8; }
      .dir, .lan { stroke: #656c76; }
      .hd { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ha" d="M0 0 10 5 0 10z"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hd" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="899" height="235" rx="12"/>

  <rect class="box" x="16" y="62" width="170" height="76" rx="10"/>
  <text class="t" x="101" y="96" text-anchor="middle">Ваши устройства</text>
  <text class="s" x="101" y="116" text-anchor="middle">ноутбуки, телефоны, ТВ</text>

  <path class="lan" d="M186 100 H224" marker-end="url(#d)"/>

  <rect class="hi" x="230" y="28" width="170" height="144" rx="12"/>
  <text class="t" x="315" y="96" text-anchor="middle">Роутер + Shadow</text>
  <text class="s" x="315" y="116" text-anchor="middle">OpenWrt · LuCI</text>

  <path class="tun" d="M400 58 H584" marker-end="url(#a)"/>
  <text class="lt" x="492" y="47" text-anchor="middle">через туннель</text>
  <text class="s" x="492" y="78" text-anchor="middle">выбранное или всё</text>

  <path class="dir" d="M400 142 H584" marker-end="url(#d)"/>
  <text class="ld" x="492" y="131" text-anchor="middle">напрямую</text>
  <text class="s" x="492" y="162" text-anchor="middle">всё остальное</text>

  <rect class="srv" x="590" y="28" width="150" height="60" rx="10"/>
  <text class="t" x="665" y="54" text-anchor="middle">Ваш сервер</text>
  <text class="s" x="665" y="73" text-anchor="middle">SSH или Xray</text>

  <rect class="box" x="590" y="112" width="150" height="60" rx="10"/>
  <text class="t" x="665" y="138" text-anchor="middle">Провайдер</text>
  <text class="s" x="665" y="157" text-anchor="middle">как обычно</text>

  <path class="tun" d="M740 58 H780" marker-end="url(#a)"/>
  <path class="dir" d="M740 142 H780" marker-end="url(#d)"/>

  <rect class="box" x="786" y="28" width="98" height="144" rx="12"/>
  <text class="t" x="835" y="105" text-anchor="middle">Интернет</text>

  <text class="n" x="16" y="210">По умолчанию, если туннель упал, сайты из туннеля блокируются (kill switch), а остальное работает как обычно.</text>
</svg>
