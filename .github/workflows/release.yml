# Releases Shadow for OpenWrt from the default branch, like the desktop app's release workflow (DESIGN.md 11).
# Every push to the default branch runs the whole CI (ci.yml through workflow_call, the lab included; ci.yml skips
# its own run of that push, so the checks run once). When the version in build/VERSION has no release yet, the
# packages are built with scripts/build-release.sh (what a local build runs) and published as release X.Y.Z: a
# plain tag, no "v", on the built commit; a draft first, every upload checked, then published as the latest
# release, which install.sh downloads. A version that is released already ends the run with a notice: bump it
# with scripts/make-release.sh, which commits "feat: release - version X.Y.Z". Nothing is built or published from
# a commit whose checks fail; re-run the failed jobs, or push a fix (the version is still unreleased).
name: Release

on:
  # Releases come from master only; ci.yml tests pushes to the other branches. The gate also checks that master is
  # the default branch.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# The next run's gate starts only after this one has published. A newer pending run replaces an older pending
# one; a running release is never cancelled, since that can leave a draft behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # What every release publishes: scripts/build-release.sh builds exactly these, install.sh downloads the
  # packages and SHA256SUMS
  ASSETS: shadow-vpn.apk luci-app-shadow-vpn.apk luci-i18n-shadow-vpn-ru.apk install.sh SHA256SUMS

jobs:
  gate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.gate.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /build/VERSION
            /scripts/lib/
            /.github/scripts/
          sparse-checkout-cone-mode: false

      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(bash .github/scripts/release-state.sh)
          version=$(cat build/VERSION)
          case $state in
            released)
              echo "::notice title=Релиз пропущен::Версия $version уже выпущена. Чтобы выпустить новую, поднимите версию через scripts/make-release.sh (коммит «feat: release - version X.Y.Z») и запушьте коммит."
              should_release=false
              ;;
            retry)
              echo "::notice::Тег $version уже стоит на этом коммите, а релиза нет: публикую его."
              should_release=true
              ;;
            *) should_release=true ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  # Every push to master, released or not, gets the whole CI here (ci.yml itself ignores pushes to master). It
  # runs even when the gate refused the version, so the push is still tested.
  quality:
    needs: gate
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release: true
      # install_test.sh skips the published release only when this run replaces it
      publishing: ${{ needs.gate.outputs.should_release == 'true' }}

  build:
    needs: [gate, quality]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build/mk_apk.sh with STRICT=1 in alpine:3.23 (docker), install.sh and SHA256SUMS. The files get the
      # commit's time, so a local build of this commit gives the same files.
      - name: Build (scripts/build-release.sh)
        run: scripts/build-release.sh --out "$RUNNER_TEMP/out"

      - name: Check the assets
        run: |
          if [ "$(cat build/VERSION)" != "$VERSION" ]; then
            echo "::error file=build/VERSION::build/VERSION is not $VERSION."
            exit 1
          fi
          cd "$RUNNER_TEMP/out"
          expected=$(tr ' ' '\n' <<<"$ASSETS" | LC_ALL=C sort)
          actual=$(find . -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::The build holds ${actual//$'\n'/ }, not ${expected//$'\n'/ }."
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14

  # A separate job, so the write token never shares a machine with the build, and a failed upload can be re-run
  # without rebuilding.
  publish:
    needs: [gate, quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Full history and tags for the notes, without the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /build/VERSION
            /build/CONSOLE_UPDATE
            /scripts/lib/
            /.github/scripts/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: release

      # Russian first, then English: the install command and the commits since the previous release tag, and the
      # console marker when build/CONSOLE_UPDATE names this version (DESIGN.md 11.1)
      - name: Write release notes
        run: |
          bash .github/scripts/release-notes.sh > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish ${{ needs.gate.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fresh state, not the gate's: this job may be a re-run days later.
          state=$(bash .github/scripts/release-state.sh)
          if [ "$state" = released ]; then
            echo "::error::$VERSION has already been released by another run."
            exit 1
          fi

          # GITHUB_TOKEN cannot create a tag on a commit whose workflow files differ from the default branch's;
          # the newer run of the default branch releases instead.
          git fetch --quiet --no-tags origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse "$GITHUB_SHA:.github/workflows")" != "$(git rev-parse FETCH_HEAD:.github/workflows)" ]; then
            echo "::error::.github/workflows changed on $DEFAULT_BRANCH after this commit; the newer run of $DEFAULT_BRANCH will release $VERSION."
            exit 1
          fi

          assets=()
          for f in $ASSETS; do
            assets+=("release/$f")
          done

          # Drafts have no tag yet: any draft of this version is a leftover of a killed run. The release list
          # lags behind (a draft created a second ago is often missing from it), so it only serves this clean-up.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft and .tag_name == env.VERSION) | .id' \
            | while read -r old; do gh api -X DELETE "repos/$GH_REPO/releases/$old" --silent; done

          # Draft first: install.sh only sees the release once every asset is uploaded and checked. GitHub
          # creates the lightweight tag on publish. The API returns the draft's id at once, and everything below
          # works with that id, never with a lookup in the release list.
          id=$(gh api -X POST "repos/$GH_REPO/releases" \
            -f tag_name="$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Shadow $VERSION для OpenWrt / for OpenWrt" -F body=@"$RUNNER_TEMP/notes.md" \
            -F draft=true --jq .id)
          if ! [[ $id =~ ^[0-9]+$ ]]; then
            echo "::error::Creating the draft for $VERSION returned no release id: $id"
            exit 1
          fi
          trap '[ -n "${published:-}" ] || gh api -X DELETE "repos/$GH_REPO/releases/$id" --silent || true' EXIT

          for f in "${assets[@]}"; do
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary "@$f" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$(basename "$f")" > /dev/null
          done

          # The draft by id; its asset list may also lag a moment behind the uploads
          for _ in 1 2 3 4 5 6; do
            gh api "repos/$GH_REPO/releases/$id" \
              --jq '.assets[] | "\(.name) \(.size) \(.state) \(.digest // "-")"' > "$RUNNER_TEMP/uploaded.txt"
            [ "$(wc -l < "$RUNNER_TEMP/uploaded.txt")" -ne "${#assets[@]}" ] || break
            sleep 5
          done
          if [ "$(wc -l < "$RUNNER_TEMP/uploaded.txt")" -ne "${#assets[@]}" ]; then
            echo "::error::The draft has $(wc -l < "$RUNNER_TEMP/uploaded.txt") assets instead of ${#assets[@]}."
            exit 1
          fi
          for f in "${assets[@]}"; do
            name=$(basename "$f")
            size="" asset_state="" digest=""
            read -r _ size asset_state digest < <(awk -v n="$name" '$1 == n' "$RUNNER_TEMP/uploaded.txt") || true
            if [ "$size" != "$(wc -c < "$f" | tr -d ' ')" ] || [ "$asset_state" != uploaded ]; then
              echo "::error::$name on the draft does not match the built file (size ${size:-?}, state ${asset_state:-?})."
              exit 1
            fi
            if [ "$digest" = "-" ]; then
              echo "::warning::GitHub reported no digest for $name."
            elif [ "$digest" != "sha256:$(sha256sum "$f" | cut -d' ' -f1)" ]; then
              echo "::error::$name on the draft has digest $digest, which differs from the built file."
              exit 1
            fi
          done

          gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f make_latest=true --silent
          published=1

          latest=""
          for _ in 1 2 3 4 5 6; do
            latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name || true)
            [ "$latest" = "$VERSION" ] && break
            sleep 5
          done
          if [ "$latest" != "$VERSION" ]; then
            echo "::error::/releases/latest returns \"$latest\" instead of $VERSION."
            exit 1
          fi
          # The tag's commit as release-state.sh reads it: an annotated tag (one made by hand, which
          # release-state.sh accepts as retry) is followed to its commit
          . scripts/lib/version.sh
          tag_sha=$(git ls-remote --tags origin | tag_commit "$VERSION")
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $VERSION points at ${tag_sha:-nothing}, not $GITHUB_SHA."
            exit 1
          fi
          echo "Released $VERSION: https://github.com/$GH_REPO/releases/tag/$VERSION"
