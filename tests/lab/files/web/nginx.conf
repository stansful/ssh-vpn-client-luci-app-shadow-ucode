# Echo the client's source IP: router WAN IP (203.0.113.2) => direct, vpn-server (203.0.113.20) => tunnelled.
server {
    listen 80 default_server;
    listen 443 ssl default_server;          # TLS 1.3 target for the REALITY inbound
    ssl_certificate     /s/web.crt;
    ssl_certificate_key /s/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        default_type text/plain;
        return 200 "src=$remote_addr dst=$server_addr host=$host\n";
    }
    location = /big { alias /srv/big.bin; default_type application/octet-stream; }
}
